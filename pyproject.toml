[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ai-face-analysis-tool"
version = "2.0.0"
description = "Modern face analysis tool with MediaPipe + InsightFace + PyQt6"
authors = [{name = "AnonBOTpl"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.5",
    "mediapipe>=0.10",
    "insightface>=0.7",
    "onnxruntime>=1.15",
    "opencv-python>=4.8",
    "Pillow>=10",
    "numpy>=1.24",
    "transformers>=4.36",
    "torch>=2.0",
    "torchvision>=0.15",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.onnx", "*.txt"]

[project.scripts]
face-analysis = "src.main:main"
